name: Update ChatGPT Voice Quantumult X rules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chatgpt-voice-rules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Quantumult X rules
        run: python DivineEngine/Ruleset/update_chatgpt_voice.py

      - name: Commit changes when the IP list changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DivineEngine/Ruleset/ChatGPTVoice.list

          if git diff --cached --quiet; then
            echo "No IP range changes."
            exit 0
          fi

          git commit -m "chore: update ChatGPT Voice IP ranges"
          git push
